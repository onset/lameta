name: Build/publish

# A push to master, beta or release builds lameta for Windows and Mac without publishing it.
#
# Publishing happens only when someone runs this workflow ("Run workflow" on the Actions page,
# or `gh workflow run main.yml --ref beta -f version=4.0.53-beta`). The branch picks the channel:
# master publishes alpha, beta publishes beta, release publishes release. The version job works
# out the next version for that channel (scripts/nextVersion.mjs), writes it into package.json
# and commits that to the branch; the builds then use that commit, so each installer, the draft
# GitHub release, and the Sentry release all carry the same version. README.md explains the
# numbering.
on:
  push:
    branches:
      - master
      - beta
      - release
  workflow_dispatch:
    inputs:
      version:
        description: "The version you expect this to publish (optional). The run stops if the next version for this branch is different."
        required: false
        type: string

permissions:
  contents: write # push the version commit, and create the draft release

jobs:
  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Work out the version and commit it to the branch
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Drafts count too, so a draft that nobody has published yet keeps its number.
          gh release list --limit 1000 --json tagName -q '.[].tagName' > "$RUNNER_TEMP/tags.txt"
          VERSION=$(node scripts/nextVersion.mjs --branch "$BRANCH" --tags-file "$RUNNER_TEMP/tags.txt")
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$VERSION" ]; then
            echo "::error::Expected to publish $EXPECTED, but the next version from $BRANCH is $VERSION."
            exit 1
          fi
          node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")' "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet || git commit -m "Publish $VERSION [skip ci]"
          # This fails if someone pushed to the branch since the run started; run it again.
          git push origin "HEAD:$BRANCH"
          SHA=$(git rev-parse HEAD)
          # electron-builder uploads into this draft. Left to itself it would create the draft
          # pointing at the default branch, so publishing it would tag the wrong commit.
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            PRERELEASE=""
            case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
            gh release create "v$VERSION" --draft $PRERELEASE --target "$SHA" --title "$VERSION" --notes ""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION from $BRANCH"

  build:
    needs: version
    # The version job is skipped on a push; the build still runs then.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}

    strategy:
      # don't quit checking one OS just because another failed
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Sync clock (see https://github.com/actions/runner/issues/2996)
        if: startsWith(matrix.os, 'macos') # in dec 2023, github action macs were having trouble with time
        run: sudo sntp -sS time.windows.com

      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # when publishing, the commit that holds the new version
          ref: ${{ needs.version.outputs.sha || github.sha }}

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.15.0"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Write out segment key
        env:
          SEGMENT_API: ${{ secrets.SEGMENT_API }}
        run: |
          # note: not really hidden from a determined user
          echo "$SEGMENT_API" > ./assets/.segment
        shell: bash

      - name: Prepare for app notarization (macOS) # REVIEW: this may not be used anymore with the switch from altool to notarize
        if: startsWith(matrix.os, 'macos')
        # Import Apple API key for app notarization on macOS
        run: |
          mkdir -p ~/private_keys/
          echo '${{ secrets.api_key }}' > ~/private_keys/AuthKey_${{ secrets.api_key_id }}.p8

      - name: Run full build (includes string extraction)
        run: vp run fullbuild

      - name: Build/publish Electron app
        # Upload the installers to the draft GitHub release only when publishing
        run: vp exec electron-builder --config electron-builder.config.js ${{ startsWith(matrix.os, 'macos') && '--mac' || '--win' }} --publish ${{ github.event_name == 'workflow_dispatch' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          # the macOS signing certificate; on Windows these stay empty, so electron-builder signs nothing
          CSC_LINK: ${{ startsWith(matrix.os, 'macos') && secrets.PROD_MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.PROD_MACOS_CERTIFICATE_PWD || '' }}
          # it's not clear which of these are used I see both in other people's yml
          APPLEID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID}}
          APPLEIDPASS: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }} # this is the "app-specific password", not the account password
          APPLETEAMID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          # These underline versions from https://github.com/karaggeorge/electron-builder-notarize
          APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }} # this is the "app-specific password", not the account password
          APPLE_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          # got an error specifically asking for this
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}

      - name: Make the Sentry release and upload source maps
        # On both platforms, in case their bundles differ; uploading the same file twice is harmless.
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          LAMETA_SENTRY_AUTH_TOKEN: ${{ secrets.LAMETA_SENTRY_AUTH_TOKEN }}
        run: ./make-sentry-release.sh
