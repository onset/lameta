<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Test Plugin</title>
  </head>
  <body>
    <div id="err" style="color: red"></div>
    <!-- Single inline script: implements the postMessage protocol directly (no imports) so the
         fixture stays buildless and self-contained. On init it writes a sidecar and renders a
         marker element the e2e test asserts on. -->
    <script>
      const pending = new Map();
      let nextId = 1;

      function call(method, params) {
        const id = nextId++;
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          parent.postMessage({ type: "lameta:request", id, method, params }, "*");
        });
      }

      window.addEventListener("message", (e) => {
        const d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "lameta:init") {
          onInit(d.context);
        } else if (d.type === "lameta:response") {
          const p = pending.get(d.id);
          if (!p) return;
          pending.delete(d.id);
          if (d.error) p.reject(new Error(d.error));
          else p.resolve(d.result);
        }
      });

      async function onInit(context) {
        try {
          await call("writeSidecar", [
            JSON.stringify({ ok: true, file: context.file.name }),
            "e2e"
          ]);
        } catch (err) {
          document.getElementById("err").textContent = err.message;
        }
        const el = document.createElement("div");
        el.setAttribute("data-testid", "test-plugin-loaded");
        el.textContent = "Test plugin loaded: " + context.file.name;
        document.body.appendChild(el);
      }

      // Tell the host we're ready for lameta:init.
      parent.postMessage({ type: "lameta:ready" }, "*");
    </script>
  </body>
</html>
